<svg xmlns="http://www.w3.org/2000/svg" width="440" height="96" viewBox="0 0 440 96" role="img" aria-labelledby="titulo descripcion">
  <!-- El botón del README que abre la página publicada (https://joelpasapera.github.io/StatSim-Pro/). El enlace lo pone el
       README (un <a> alrededor de la imagen): una imagen de GitHub no puede llevar su propio enlace. Los textos van centrados
       en su hueco, para que quepan con la letra que tenga cada sistema. -->
  <title id="titulo">Abrir StatSim Pro</title>
  <desc id="descripcion">Botón azul que abre StatSim Pro en el navegador: joelpasapera.github.io/StatSim-Pro</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6FD6"/>
      <stop offset="1" stop-color="#1F4596"/>
    </linearGradient>
    <filter id="sombra" x="-8%" y="-20%" width="116%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0B1F4D" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="6" width="424" height="80" rx="18" fill="url(#fondo)" filter="url(#sombra)"/>
  <rect x="8.5" y="6.5" width="423" height="79" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <circle cx="54" cy="46" r="25" fill="#FFFFFF"/>
  <path d="M47 33.5 L67 46 L47 58.5 Z" fill="#2E5BBA" stroke="#2E5BBA" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" fill="#FFFFFF" text-anchor="middle">
    <text x="256" y="44" font-size="26" font-weight="700">Abrir StatSim Pro</text>
    <text x="256" y="68" font-size="14" fill-opacity="0.88">joelpasapera.github.io/StatSim-Pro</text>
  </g>
</svg>
